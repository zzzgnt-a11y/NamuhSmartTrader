name: deploy-speed-check

on:
  push:
    branches: [main]

concurrency:
  group: deploy-speed-check-main
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for this commit on Render
        shell: bash
        run: |
          set -euo pipefail
          base='https://namuh-smart-trader.onrender.com'
          short="${GITHUB_SHA:0:12}"
          echo "waiting for build=$short"
          matched=0
          for i in $(seq 1 90); do
            headers="$(curl -fsS -D - -o /tmp/home "$base/" || true)"
            build="$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-gy-build"{print $2}' | tail -1)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/v34/status" || true)"
            echo "poll=$i home_build=${build:-none} status=$code"
            if [[ "$build" == "$short" && "$code" == "200" ]]; then
              matched=1
              break
            fi
            sleep 5
          done
          if [[ "$matched" != "1" ]]; then
            echo "Render did not expose expected build $short" >&2
            exit 1
          fi

      - name: Benchmark deployed endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://namuh-smart-trader.onrender.com'
          : > speed-results.txt
          urls=(
            '/'
            '/api/v34/status'
            '/api/state?market=KR'
            '/api/state?market=US'
          )
          for path in "${urls[@]}"; do
            echo "ENDPOINT $path" | tee -a speed-results.txt
            for i in $(seq 1 7); do
              line="$(curl -sS --max-time 25 -o /tmp/body -w 'code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}' "$base$path")"
              echo "run=$i $line" | tee -a speed-results.txt
              [[ "$line" == code=200* ]] || exit 1
              if [[ "$path" == '/api/v34/status' ]]; then
                python - <<'PY'
          import json
          with open('/tmp/body','rb') as f:
              data=json.load(f)
          assert isinstance(data,dict)
          print('status_json_ok keys=', len(data))
          PY
              fi
              if [[ "$path" == '/api/state?market=KR' || "$path" == '/api/state?market=US' ]]; then
                python - <<'PY'
          import json
          with open('/tmp/body','rb') as f:
              data=json.load(f)
          assert isinstance(data,dict)
          assert data.get('mode') in ('KR','US')
          assert 'market' in data and 'paper' in data
          print('state_json_ok mode=',data.get('mode'),'keys=',len(data))
          PY
              fi
            done
          done
          echo '--- summaries ---' | tee -a speed-results.txt
          python - <<'PY' | tee -a speed-results.txt
          import re, statistics
          from pathlib import Path
          cur=None; vals={}
          for line in Path('speed-results.txt').read_text().splitlines():
              if line.startswith('ENDPOINT '):
                  cur=line.split(' ',1)[1]; vals.setdefault(cur,[])
              m=re.search(r'ttfb=([0-9.]+) total=([0-9.]+)',line)
              if cur and m:
                  vals[cur].append((float(m.group(1)),float(m.group(2))))
          for path, xs in vals.items():
              if not xs: continue
              ttfb=[x[0] for x in xs]; total=[x[1] for x in xs]
              print(path, 'ttfb_med=',round(statistics.median(ttfb),4),'total_med=',round(statistics.median(total),4),'total_max=',round(max(total),4))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-results-${{ github.sha }}
          path: speed-results.txt
