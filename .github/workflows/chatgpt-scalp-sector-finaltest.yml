name: ChatGPT Scalp Sector Final Test
on:
  push:
    branches: [chatgpt-scalp-sector-finaltest-0908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check nonfixed scalp discovery
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://namuh-smart-trader.onrender.com'
          fixed=set(['005930','000660','035420','035720','068270','012450','267260','042700','005380','000270','105560','055550','086790','028260','207940'])
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'NamuhNonfixedAudit/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          h=get('/api/v34/status');u=get('/api/v352/universe?market=KR&catalog=0');st=get('/api/state?market=KR')
          rows=u.get('scores') or []; codes=[str(x.get('code') or '') for x in rows]
          print('AUDIT',json.dumps({'build':h.get('build'),'count':len(rows),'codes':codes,'names':[x.get('name') for x in rows],'nonfixed':[c for c in codes if c not in fixed],'source':u.get('score_source'),'source_counts':u.get('source_counts'),'sectors':(st.get('sectors') or [])[:8]},ensure_ascii=False))
          PY
