name: ChatGPT Scalp Sector Final Test
on:
  push:
    branches: [chatgpt-scalp-sector-finaltest-0908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck warmed live detector
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base='https://namuh-smart-trader.onrender.com'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'NamuhWarmAudit/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          for i in range(4):
              h=get('/api/v34/status'); u=get('/api/v352/universe?market=KR&catalog=0'); st=get('/api/state?market=KR')
              rows=u.get('scores') or []; secs=st.get('sectors') or []
              print('SNAP',i,json.dumps({'build':h.get('build'),'loop':h.get('loop'),'universe':{k:u.get(k) for k in ('scored_count','score_source','source_counts','updated_at')},'codes':[x.get('code') for x in rows[:30]],'names':[x.get('name') for x in rows[:30]],'sector_count':len(secs),'sectors':secs[:6]},ensure_ascii=False))
              time.sleep(15)
          PY
