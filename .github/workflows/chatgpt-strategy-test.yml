name: ChatGPT Strategy Validation

on:
  push:
    branches: [chatgpt-strategy-test-20260908]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax checks
        run: |
          python -m py_compile namuh_conditions_final_patch.py
          python -m py_compile namuh_c3_sync_price_patch.py
          python -m py_compile namuh_ai_scoreboard_patch.py
          python -m py_compile namuh_patch_loader.py
      - name: Strategy unit tests x3
        run: |
          for round in 1 2 3; do
            echo "TEST ROUND $round"
            python - <<'PY'
          import namuh_conditions_final_patch as m

          # Condition 1/2 orderbook score table
          assert m._order8(2.0) == 8.0
          assert m._order8(1.5) == 7.0
          assert m._order8(1.3) == 5.0
          assert m._order8(1.1) == 4.0
          assert m._order8(1.0) == 3.0
          assert m._order8(0.9) == 2.0
          assert m._order8(0.89) == 0.0

          # Volume interpolation table
          assert m._interp_volume15(0.5) == 0.0
          assert m._interp_volume15(0.6) == 1.0
          assert m._interp_volume15(0.7) == 3.0
          assert m._interp_volume15(0.8) == 6.0
          assert m._interp_volume15(0.9) == 9.0
          assert m._interp_volume15(1.0) == 10.0
          assert m._interp_volume15(1.1) == 12.5
          assert m._interp_volume15(1.2) == 14.0
          assert m._interp_volume15(1.3) == 15.0

          # Execution gate: immediate / blocked / 50-sec rising sequence
          class Q: pass
          q = Q(); q.execution_strength = 110; q.execution_history = []
          ok, _ = m._execution_gate(q, 1000)
          assert ok
          q.execution_strength = 89
          ok, _ = m._execution_gate(q, 1000)
          assert not ok
          q.execution_strength = 95
          q.execution_history = [(950,92.0),(960,92.6),(970,93.2),(980,94.0),(990,94.6),(1000,95.3)]
          ok, _ = m._execution_gate(q, 1000)
          assert ok

          # 3-minute score trend behavior
          rising = [(0,60),(180,64),(360,68)]
          assert m._score_rising(rising)
          sig, _ = m._score_exit([(0,60),(180,68),(360,67)])
          assert sig

          # Condition 3 sideways detector: >=3% range and >=2 round trips
          samples = [(0,100.0),(60,103.5),(120,100.1),(180,103.4),(240,100.0),(300,103.5)]
          transitions, meta = m._c3_zone_transitions(samples)
          assert meta is not None
          assert meta['width_pct'] >= 3.0
          assert transitions >= 4
          assert m._c3_current_pos(100.0,100.0,103.5) <= 0.15
          assert m._c3_current_pos(103.5,100.0,103.5) >= 0.85

          # Final constants / windows
          assert m._C1_THRESHOLD == 72.0
          assert m._C2_THRESHOLD == 70.0
          assert m._KR_C1_AM == (540, 560)
          assert m._KR_C2_AM == (540, 585)
          assert m._KR_C3_BUY_AM == (630, 780)
          assert m._KR_C3_BUY_PM == (840, 925)
          print('PASS')
          PY
          done
      - name: Import smoke test
        run: |
          python - <<'PY'
          import namuh_conditions_final_patch
          import namuh_c3_sync_price_patch
          import namuh_ai_scoreboard_patch
          import namuh_patch_loader
          print('IMPORT PASS')
          PY
