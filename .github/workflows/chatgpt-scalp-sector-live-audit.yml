name: ChatGPT Scalp Sector Live Audit
on:
  push:
    branches: [chatgpt-scalp-sector-live-audit-0908]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect live cache and universe
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://namuh-smart-trader.onrender.com'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'NamuhScalpCacheAudit/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          h=get('/api/v34/status')
          st=get('/api/state?market=KR')
          u=get('/api/v352/universe?market=KR&catalog=0')
          print('HEALTH',json.dumps({'build':h.get('build'),'loop':h.get('loop'),'scalp_sector_final':h.get('scalp_sector_final'),'diag':h.get('diagnostics')},ensure_ascii=False))
          for k in ('scalp','candidates','scores'):
              if k in st: print('STATE_'+k.upper(),json.dumps(st.get(k),ensure_ascii=False))
          print('STATE_KEYS',sorted(st.keys()))
          print('UNIVERSE',json.dumps(u,ensure_ascii=False))
          PY
