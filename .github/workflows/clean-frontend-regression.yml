name: current-frontend-regression

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile runtime_server_pc.py runtime_server_v34.py namuh_patch_loader.py namuh_clean_frontend_patch.py
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/stock.js
          node --check static/v364_main.js
          node --check static/v365_market_ui_fix.js
      - name: Current frontend invariants 5 consecutive cycles
        run: |
          python -m unittest tests.test_clean_frontend_static -v
