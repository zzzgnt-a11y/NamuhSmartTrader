name: clean-frontend-regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile runtime_server_clean.py namuh_clean_frontend_patch.py namuh_patch_loader.py
      - name: JavaScript syntax
        run: |
          node --check static/rebuild.js
          node --check static/rebuild-stock.js
      - name: 1000-cycle frontend invariants
        run: |
          python -m unittest tests.test_clean_frontend_static -v
