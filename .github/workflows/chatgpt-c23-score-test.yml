name: ChatGPT C2 C3 Score Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile namuh_conditions_final_patch.py namuh_score_floor1_history_patch.py
      - name: Verify Condition2 scoring and output
        run: |
          python - <<'PY'
          from pathlib import Path
          import namuh_conditions_final_patch as c

          class Q: pass
          q=Q(); q.execution_strength=110
          assert c._execution40(q, True)==40.0
          assert c._execution40(q, False)==0.0
          q.execution_strength=100
          assert c._execution40(q, True)==30.0

          assert c._order8(2.0)==8.0
          assert c._order8(1.5)==7.0
          assert c._order8(1.3)==5.0
          assert c._order8(1.1)==4.0
          assert c._order8(1.0)==3.0
          assert c._order8(0.9)==2.0
          assert c._order8(0.89)==0.0

          def c2(vol15,e40,o8,ch5,std45):
              vol25=round(c._clamp(vol15/15.0*25.0,0,25),1)
              book25=round(c._clamp(o8/8.0*25.0,0,25),1)
              tech5=round(c._clamp(std45/45.0*5.0,0,5),1)
              return round(c._clamp(vol25+e40+book25+ch5+tech5,0,100),1)
          assert c2(15,40,8,5,45)==100.0
          assert c2(0,0,0,0,0)==0.0

          src=Path('namuh_conditions_final_patch.py').read_text(encoding='utf-8')
          required=[
              'c2_total = round(_clamp(vol25 + exec40 + book25 + ch5 + tech5, 0, 100), 1)',
              '"label": "조건2", "score": c2_total',
              '"breakdown": {"volume25": vol25, "execution40": exec40, "orderbook25": book25, "change5": ch5, "technical5": tech5}',
              'out["condition2_score"] = c2_total',
              'out["condition2_gate_pass"] = c2_gate',
          ]
          for s in required:
              assert s in src, s

          floor=Path('namuh_score_floor1_history_patch.py').read_text(encoding='utf-8')
          for bad in ('c._order8 =','c._execution40 =','c._standard45 =','c._interp_volume15 ='):
              assert bad not in floor, bad
          print('CONDITION2 SCORE/OUTPUT PASS')
          PY
      - name: Verify Condition3 recipe output
        run: |
          python - <<'PY'
          from pathlib import Path
          import namuh_conditions_final_patch as c

          assert c._c3_current_pos(100,100,110)==0.0
          assert abs(c._c3_current_pos(101.5,100,110)-0.15)<1e-9
          assert c._c3_current_pos(102,100,110)>0.15
          assert c._c3_current_pos(100,100,100) is None

          src=Path('namuh_conditions_final_patch.py').read_text(encoding='utf-8')
          required=[
              '(hi - lo) / lo * 100.0 < 3.0',
              '"round_trips": transitions // 2',
              'if not meta or transitions < 4:',
              'c3_qualified["KR"] = dict(ranked)',
              'reverse=True)[:3]',
              'if px > 0 and pos is not None and pos <= 0.15:',
              '"condition3": {"label": "조건3", "gate": True',
              '"current_position": round(pos, 3)',
          ]
          for s in required:
              assert s in src, s

          # Condition3 is intentionally rule/gate based; the user's recipe has no 100-point allocation.
          assert 'condition3_score' not in src
          print('CONDITION3 RULE/OUTPUT PASS')
          PY
