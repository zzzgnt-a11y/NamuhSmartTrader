name: ChatGPT Data Integrity Test
on:
  push:
    branches: [chatgpt-data-integrity-test-20260908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fast cached Samsung universe check
        run: |
          python - <<'PY'
          import json,urllib.request,datetime
          url='https://namuh-smart-trader.onrender.com/api/v352/universe?market=KR&catalog=0'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r:d=json.load(r)
          x=next((r for r in (d.get('scores') or []) if str(r.get('code'))=='005930'),None)
          print('UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          print('SAMSUNG='+json.dumps(x,ensure_ascii=False,sort_keys=True))
          if not x: raise SystemExit('Samsung missing')
          PY
