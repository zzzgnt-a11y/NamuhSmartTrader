name: ChatGPT Score Integrity Test
on:
  push:
    branches: [chatgpt-score-integrity-test-20260908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile namuh_c1_score_integrity_patch.py namuh_score_floor1_history_patch.py
      - name: Verify scoring helpers
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from datetime import datetime, timezone, timedelta
          from engine import Quote, rsi_points
          import namuh_c1_score_integrity_patch as p
          q=Quote('005930','삼성전자'); q.execution_strength=130.0; q.execution_history.append((1.0,95.0))
          score,ok,reason=p._execution(None,q,999999.0)
          assert score==12.0 and ok
          bars=[{'time':'20260908091700','open':100,'high':101,'low':99,'close':100,'volume':1},{'time':'20260908091800','open':100,'high':100,'low':98,'close':99,'volume':1},{'time':'20260908091900','open':99,'high':101,'low':98.5,'close':101,'volume':1}]
          class Feed:
              def bars(self,m,c,tf): return bars
          core=SimpleNamespace(feed=Feed(),KST=timezone(timedelta(hours=9))); q.price=101
          s,g,m=p._minute_score(core,q,'KR',datetime(2026,9,8,9,19,tzinfo=core.KST))
          assert 9 <= s <= 10 and g
          xs=[100,99,100,99.5,100.5,100,101,100.5,101.5,101,102,101.5,102.5,102,103,102.5,103.5,103,104,103.5,104.5,104]
          rv=p._rsi_wilder(xs,14); pts=rsi_points(rv)
          assert 0 <= rv <= 100 and 0 <= pts <= 10
          print('execution',score,ok,reason); print('minute',s,g,m['score_parts']); print('rsi',rv,pts)
          PY
      - name: Samsung live data source audit
        run: |
          python - <<'PY'
          import json,time,urllib.request
          def get(url):
              last=None
              for _ in range(6):
                  try:
                      with urllib.request.urlopen(url,timeout=30) as r:return json.load(r)
                  except Exception as e:last=e;time.sleep(5)
              raise RuntimeError(last)
          uni=get('https://namuh-smart-trader.onrender.com/api/v352/universe?market=KR&catalog=0')
          rows=uni.get('scores') or []
          row=next((x for x in rows if str(x.get('code'))=='005930'),None)
          print('SAMSUNG_UNIVERSE='+json.dumps(row,ensure_ascii=False,sort_keys=True))
          mt=get('https://namuh-smart-trader.onrender.com/api/minute/top?limit=100&fresh=false')
          mrows=mt if isinstance(mt,list) else (mt.get('rows') or mt.get('items') or mt.get('data') or [])
          mrow=next((x for x in mrows if str(x.get('code') or x.get('symbol') or x.get('iem_cd'))=='005930'),None)
          print('MINUTE_TOP_TYPE='+type(mt).__name__)
          print('SAMSUNG_MINUTE_SYNC='+json.dumps(mrow,ensure_ascii=False,sort_keys=True))
          if not row: raise SystemExit('005930 missing from universe')
          if row.get('score_integrity_error'): raise SystemExit('score_integrity_error='+str(row.get('score_integrity_error')))
          PY
