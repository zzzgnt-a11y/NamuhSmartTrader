name: ChatGPT Score Integrity Test
on:
  push:
    branches: [chatgpt-score-integrity-test-20260908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect currentExecution schema
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://www.nhplug.com/openapi-docs/krstock/openapi.json',timeout=30) as r: s=json.load(r)
          p=s['paths']['/krstock/quote/v1/currentExecution']['post']
          sch=p['responses']['200']['content']['application/json']['schema']['properties']
          for outname,node in sch.items():
              target=node
              if target.get('type')=='array': target=target.get('items',{})
              props=target.get('properties',{})
              print('OUTPUT',outname,'TYPE',node.get('type'),'FIELDS')
              for k,v in props.items(): print(k,'=',str(v.get('description') or '')[:90])
          rb=p.get('requestBody',{}).get('content',{}).get('application/json',{}).get('schema',{})
          print('REQUEST',json.dumps(rb,ensure_ascii=False)[:5000])
          PY
