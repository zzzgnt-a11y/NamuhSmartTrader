name: ChatGPT Score Integrity Test
on:
  push:
    branches: [chatgpt-score-integrity-test-20260908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: NHPLUG field truth
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://www.nhplug.com/openapi-docs/krstock/openapi.json'
          with urllib.request.urlopen(url, timeout=30) as r: spec=json.load(r)
          print('PATH_EXISTS', '/krstock/quote/v1/currentPrice' in spec.get('paths',{}))
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}/{k}'
                      if isinstance(v,dict):
                          desc=str(v.get('description') or '')
                          low=(k+' '+desc).lower()
                          if any(t in low for t in ['체결강도','strength','체결','volpower','rate']):
                              print('MATCH',p,'DESC=',desc[:120])
                      walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}/{i}')
          cp=spec.get('paths',{}).get('/krstock/quote/v1/currentPrice',{})
          walk(cp,'currentPrice')
          rt=spec.get('x-realtime-channels') or {}
          for k,v in rt.items():
              if str(k).lower() in ('mc','oc','nc') or '체결가' in str(v):
                  print('CHANNEL',k)
                  walk(v,f'channel/{k}')
          PY
      - name: Syntax
        run: python -m py_compile namuh_c1_score_integrity_patch.py namuh_score_floor1_history_patch.py
