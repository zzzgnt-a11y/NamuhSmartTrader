name: ChatGPT Score Integrity Test
on:
  push:
    branches: [chatgpt-score-integrity-test-20260908]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find NHPLUG execution-strength source
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://www.nhplug.com/openapi-docs/krstock/openapi.json',timeout=30) as r: spec=json.load(r)
          def scan(x,path=''):
              if isinstance(x,dict):
                  desc=str(x.get('description') or '')
                  if '체결강도' in desc:
                      print('EXEC_STRENGTH',path,'DESC=',desc[:160])
                  for k,v in x.items(): scan(v,f'{path}/{k}')
              elif isinstance(x,list):
                  for i,v in enumerate(x): scan(v,f'{path}/{i}')
          scan(spec)
          print('PATHS')
          for p in spec.get('paths',{}):
              if any(t in p.lower() for t in ('time','tick','cont','execution','current')):
                  print(p)
          print('REALTIME_TOP_KEYS', list((spec.get('x-realtime-channels') or {}).keys()))
          print('REALTIME_RAW_TYPE', type(spec.get('x-realtime-channels')).__name__)
          print('REALTIME_RAW_PREFIX', str(spec.get('x-realtime-channels'))[:5000])
          PY
      - name: Syntax
        run: python -m py_compile namuh_c1_score_integrity_patch.py namuh_score_floor1_history_patch.py
