name: ChatGPT Live Score Verify
on:
  push:
    branches: [chatgpt-live-score-verify-20260908]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Samsung exact-score progress
        run: |
          python - <<'PY'
          import json,urllib.request,time
          url='https://namuh-smart-trader.onrender.com/api/v344/stock/KR/005930?timeframe=1m&days=60'
          for i in range(3):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=60) as r:d=json.load(r)
              c1=((d.get('strategy_conditions') or {}).get('condition1') or {})
              c2=((d.get('strategy_conditions') or {}).get('condition2') or {})
              tm=c1.get('technical_meta') or {}
              print('CHECK',i,json.dumps({
                  'price':d.get('price'),'flow':d.get('flow'),
                  'c1':c1.get('score'),'prereq':c1.get('prerequisite_score'),'std':c1.get('standard_score'),'bonus':c1.get('bonus_score'),
                  'breakdown':c1.get('breakdown'),'raw':c1.get('standard_raw'),'actual':c1.get('standard_raw_before_floor'),
                  'values':tm.get('technical_values'),'volume_ratio':tm.get('volume_ratio'),'volume_days':tm.get('volume_history_days'),
                  'volume_queued':tm.get('volume_backfill_queued'),'orderbook':c1.get('orderbook'),
                  'execution':c1.get('execution_strength'),'execution_reason':c1.get('execution_reason'),
                  'minute':c1.get('minute_meta'),'c2':c2.get('score'),'c2b':c2.get('breakdown')
              },ensure_ascii=False,sort_keys=True))
              time.sleep(4)
          PY
