name: ChatGPT Live Score Verify
on:
  push:
    branches: [chatgpt-live-score-verify-20260908]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect NH orderbook REST truth
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://www.nhplug.com/openapi-docs/krstock/openapi.json',timeout=30) as r:s=json.load(r)
          for path,node in s.get('paths',{}).items():
              blob=json.dumps(node,ensure_ascii=False)
              if '호가' in blob and any(t in blob for t in ('잔량','매도호가','매수호가')):
                  print('PATH',path)
                  post=node.get('post') or {}
                  try:
                      props=post['responses']['200']['content']['application/json']['schema']['properties']
                  except Exception: continue
                  for oname,onode in props.items():
                      t=onode.get('items',{}) if onode.get('type')=='array' else onode
                      pp=t.get('properties',{})
                      useful=[]
                      for k,v in pp.items():
                          d=str(v.get('description') or '')
                          if any(w in d for w in ('잔량','호가')): useful.append((k,d))
                      if useful:
                          print(' OUTPUT',oname)
                          for k,d in useful: print('  ',k,'=',d)
          PY
