plugins {
    id 'com.android.application'
}

android {
    namespace 'com.namuh.smarttrader'
    compileSdk 35

    defaultConfig {
        applicationId "com.namuh.smarttrader"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
