<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <title>GY 종목 분석</title>
  <link rel="stylesheet" href="/static/styles.css?v=23">
</head>
<body class="stock-body">
  <div class="stock-shell">
    <header class="stock-topbar">
      <button id="backBtn" class="ghost-btn">← 시장으로</button>
      <div class="stock-title">
        <div class="eyebrow">GY DEEP DIVE</div>
        <h1 id="stockName">종목 로딩 중</h1>
        <p id="stockMeta">-</p>
      </div>
      <div class="stock-price-box"><span>현재가</span><strong id="stockPrice">-</strong></div>
    </header>

    <main class="stock-page">
      <section class="panel chart-panel">
        <div class="panel-head">
          <div><span class="section-no">01</span><h2>캔들 차트</h2></div>
          <div class="tf-group">
            <button data-tf="1m" class="tf">1분</button>
            <button data-tf="3m" class="tf">3분</button>
            <button data-tf="5m" class="tf">5분</button>
            <button data-tf="20m" class="tf">20분</button>
            <button data-tf="1d" class="tf active">일봉</button>
          </div>
        </div>
        <div class="chart-toolbar">
          <span id="chartStatus">공식 데이터 로딩 중</span>
          <span>휠/핀치 확대 · 드래그 이동 · 더블클릭 초기화</span>
        </div>
        <div id="candleWrap" class="candle-wrap">
          <canvas id="candleCanvas"></canvas>
          <div id="chartTooltip" class="chart-tooltip hide"></div>
        </div>
      </section>

      <section class="detail-grid">
        <div class="panel">
          <div class="panel-head"><div><span class="section-no">02</span><h2>시간대별 AI 점수</h2></div><small>동일 종목 · 서로 다른 봉 기준</small></div>
          <div id="scoreGrid" class="score-grid"></div>
          <div id="analysisReasons" class="reason-stack"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div><span class="section-no">03</span><h2>수급 현황</h2></div><small id="flowCaption">국장 실시간 수급</small></div>
          <div id="flowGrid" class="flow-grid"></div>
        </div>
      </section>

      <section class="detail-grid">
        <div class="panel">
          <div class="panel-head"><div><span class="section-no">04</span><h2>AI 점수 분해</h2></div><small>왜 이 점수인지 확인</small></div>
          <div id="breakdown" class="breakdown"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div><span class="section-no">05</span><h2>최근 이벤트</h2></div><small>최근 2일 공식 공시</small></div>
          <div id="stockEvents"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/stock.js?v=23"></script>
</body>
</html>
