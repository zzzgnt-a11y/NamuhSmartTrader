databases:
  - name: namuh-smart-trader-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: namuh_smart_trader_db
    user: namuh_smart_trader_db_user

services:
  - type: web
    name: namuh-smart-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python runtime_server_v34.py
    healthCheckPath: /api/v34/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NHPLUG_APP_KEY
        sync: false
      - key: NHPLUG_APP_SECRET
        sync: false
      - key: NHPLUG_BASE_URL
        value: https://api.nhplug.com:8443
      - key: NHPLUG_AUTH_URL
        value: https://api.nhplug.com:8443
      - key: PROTECTED_CODES
        sync: false
      - key: AUTO_TRADING_ENABLED
        value: "1"
      - key: AUTO_LOOP_SECONDS
        value: "5"
      - key: SEC_USER_AGENT
        value: "GY-Trading-OS/1.0 public-market-data"
      - key: DATABASE_URL
        fromDatabase:
          name: namuh-smart-trader-db
          property: connectionString
